<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сира Викторинасы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a;
    --board-border:#7c5cff;
    --board-border-glow:#7c5cff88;
    --label-text:#f5f5f5;
    --col1-a:#8CF2B8; --col1-b:#5FE3A0;
    --col2-a:#E7F27A; --col2-b:#D6E84A;
    --col3-a:#F6C64B; --col3-b:#F0A93A;
    --col4-a:#F58A3D; --col4-b:#EE6A2A;
    --col5-a:#E5493C; --col5-b:#C22E27;
    --cell-text:#1a1207;
    --gap:6px;
    --modal-bg:#141018;
    --modal-border:#7c5cff;
    --answer-bg:#233d2b;
    --answer-border:#3fae6a;
    --font-display:'Baloo 2', 'Manrope', system-ui, sans-serif;
    --font-body:'Manrope', system-ui, sans-serif;
  }
  :root:not([data-theme="light"]){ --bg:#0a0a0a; }
  :root[data-theme="dark"]{ --bg:#0a0a0a; }

  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    background:var(--bg);
    color:var(--label-text);
    font-family:var(--font-body);
    min-height:100%;
  }

  .wrap{
    max-width:1200px;
    margin:0 auto;
    padding:28px 16px 48px;
  }

  .title{
    text-align:center;
    font-family:var(--font-display);
    font-weight:800;
    font-size:clamp(1.6rem, 4vw, 2.6rem);
    letter-spacing:0.5px;
    margin:0 0 4px;
    color:#fff;
  }
  .subtitle{
    text-align:center;
    color:#a99fc9;
    font-size:0.95rem;
    margin:0 0 24px;
  }

  .board-scroll{
    overflow-x:auto;
    padding-bottom:4px;
  }

  .board{
    background:var(--bg);
    border:3px solid var(--board-border);
    border-radius:14px;
    box-shadow:0 0 0 1px #000, 0 0 28px var(--board-border-glow);
    padding:10px;
    min-width:760px;
  }

  .grid{
    display:grid;
    grid-template-columns: 1.15fr repeat(5, 1fr);
    gap:var(--gap);
  }

  .cat-label{
    background:var(--bg);
    color:var(--label-text);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(0.78rem, 1.5vw, 1.05rem);
    line-height:1.25;
    padding:10px 8px;
    min-height:96px;
  }

  .cell{
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--font-display);
    font-weight:800;
    font-size:clamp(1.4rem, 3vw, 2.1rem);
    color:var(--cell-text);
    border-radius:6px;
    min-height:96px;
    cursor:pointer;
    border:none;
    transition:transform 0.12s ease, filter 0.12s ease;
    user-select:none;
  }
  .cell:hover:not(.opened){ transform:scale(1.035); filter:brightness(1.06); }
  .cell:active:not(.opened){ transform:scale(0.98); }
  .cell:focus-visible{ outline:3px solid #fff; outline-offset:-3px; }

  .col-0{ background:linear-gradient(160deg, var(--col1-a), var(--col1-b)); }
  .col-1{ background:linear-gradient(160deg, var(--col2-a), var(--col2-b)); }
  .col-2{ background:linear-gradient(160deg, var(--col3-a), var(--col3-b)); }
  .col-3{ background:linear-gradient(160deg, var(--col4-a), var(--col4-b)); }
  .col-4{ background:linear-gradient(160deg, var(--col5-a), var(--col5-b)); }

  .cell.opened{
    background:#161616 !important;
    color:#4a4a4a;
    cursor:default;
    box-shadow:inset 0 0 0 2px #2a2a2a;
  }
  .cell.opened::after{
    content:"✓";
    position:absolute;
  }
  .cell.opened .points{ opacity:0.5; }
  .cell{ position:relative; }
  .cell .checkmark{
    display:none;
    font-size:1.6rem;
    color:#3fae6a;
  }
  .cell.opened .points{ display:none; }
  .cell.opened .checkmark{ display:block; }

  .legend{
    margin-top:16px;
    text-align:center;
    font-size:0.85rem;
    color:#8a8296;
  }

  /* Modal */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.72);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.18s ease;
  }
  .modal-overlay.show{ opacity:1; pointer-events:auto; }

  .modal-card{
    background:var(--modal-bg);
    border:2px solid var(--modal-border);
    border-radius:16px;
    max-width:640px;
    width:100%;
    padding:32px 28px 26px;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
    transform:translateY(10px) scale(0.98);
    transition:transform 0.18s ease;
  }
  .modal-overlay.show .modal-card{ transform:translateY(0) scale(1); }

  .modal-cat{
    font-family:var(--font-display);
    font-weight:700;
    color:#c9b8ff;
    font-size:0.95rem;
    text-align:center;
    margin-bottom:6px;
  }
  .modal-points{
    text-align:center;
    font-family:var(--font-display);
    font-weight:800;
    font-size:1.9rem;
    color:#fff;
    margin-bottom:18px;
  }
  .modal-question{
    font-size:1.25rem;
    line-height:1.5;
    text-align:center;
    color:#fff;
    margin-bottom:22px;
    font-weight:600;
  }
  .modal-answer{
    display:none;
    background:var(--answer-bg);
    border:1px solid var(--answer-border);
    border-radius:10px;
    padding:16px 18px;
    margin-bottom:20px;
    font-size:1.08rem;
    line-height:1.5;
    color:#d9ffe6;
  }
  .modal-answer.show{ display:block; }
  .modal-answer-label{
    font-weight:800;
    color:#7be7a2;
    margin-bottom:4px;
    display:block;
    font-size:0.9rem;
  }

  .modal-actions{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }
  button.action-btn{
    font-family:var(--font-body);
    font-weight:800;
    font-size:0.95rem;
    padding:11px 22px;
    border-radius:10px;
    border:none;
    cursor:pointer;
    transition:filter 0.12s ease, transform 0.12s ease;
  }
  button.action-btn:hover{ filter:brightness(1.1); }
  button.action-btn:active{ transform:scale(0.97); }
  .btn-reveal{ background:#7c5cff; color:#fff; }
  .btn-close{ background:#2a2a2a; color:#eee; }

  @media (max-width: 640px){
    .cat-label{ font-size:0.72rem; min-height:78px; }
    .cell{ min-height:78px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="title">Сира Викторинасы</h1>
  <p class="subtitle">Ұяшықты таңда — сұрақ шығады, содан кейін жауабын аш</p>

  <div class="board-scroll">
    <div class="board">
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <p class="legend">Ашылған ұяшық сұр түске боялып, ✓ белгісімен қалады</p>
</div>

<div class="modal-overlay" id="overlay">
  <div class="modal-card">
    <div class="modal-cat" id="modalCat"></div>
    <div class="modal-points" id="modalPoints"></div>
    <div class="modal-question" id="modalQuestion"></div>
    <div class="modal-answer" id="modalAnswer">
      <span class="modal-answer-label">Жауабы:</span>
      <span id="modalAnswerText"></span>
    </div>
    <div class="modal-actions">
      <button class="action-btn btn-reveal" id="revealBtn">Жауапты көру</button>
      <button class="action-btn btn-close" id="closeBtn">Жабу</button>
    </div>
  </div>
</div>

<script>
const POINTS = [5, 10, 15, 20, 25];

const CATEGORIES = [
  {
    name: "Пайғамбарлыққа дейінгі өмір мен алғашқы уахи",
    q: [
      { question: "Аллаһ елшісіне (с.а.с.) алғашқы уахи қай үңгірде және қай айда түсті?", answer: "Хира үңгірінде, рамазан айында түсті." },
      { question: "Пайғамбарымыздың (с.а.с.) сүтанасы Халима қай тайпадан шыққан еді және сәби Мұхаммедті (с.а.с.) үйіне алған соң қандай берекеге куә болды?", answer: "Бәну Сағд ибн Бәкр тайпасынан. Олардың құнаң тартқан, шөпсіз жердегі қойлары өрістен қарындары тойып, желіндері сүтке толып қайтатын болды." },
      { question: "Пайғамбарымыздың (с.а.с.) ардақты атасы Абдулмутталиб қайтыс болар сәтінде сегіз жасар немересін кімнің қамқорлығына табыстады?", answer: "Әкесінің туған бауыры, көкесі Әбу Талибке табыстады." },
      { question: "Шам өлкесіндегі Бусра қаласында 12 жасар Мұхаммедті (с.а.с.) пайғамбарлық мөрі мен ағаш-тастардың сәжде етуі арқылы танып, оны Меккеге кері қайтаруды ескерткен христиан монахы кім?", answer: "Монах Бахира." },
      { question: "Пайғамбарымыз (с.а.с.) 35 жасында Қағбаны қайта тұрғызу кезінде тайпалар арасында шыққан Қара тасты (Әл-Хажар әл-Әсуад) орнату дауын қалай шешті?", answer: "Ол (с.а.с.) шапанын жайып, Қара тасты ортасына қойды да, әр рудың көсемдеріне шапанның шетінен ұстатып көтергізді, сосын тасты өз қолымен орнына қойды." }
    ]
  },
  {
    name: "Ашық дағуат, мүшріктердің қысымы және қоныс аудару",
    q: [
      { question: "«Ең жақын туыстарыңа ескерт» аяты түскен соң Пайғамбарымыз (с.а.с.) қай төбеге шығып, құрайыш әулеттерін ашық түрде тозақ отынан сақтануға шақырды?", answer: "Сафа төбесіне шығып шақырды." },
      { question: "Ислам тарихында Аллаһ жолында забір көріп, шәһид болған ең алғашқы адам кім?", answer: "Аммар ибн Ясирдің анасы Сумәййә (оны Әбу Жәһл найзамен шаншып өлтiрді)." },
      { question: "Мұсылмандардың Эфиопияға алғашқы қоныс аударуы пайғамбарлықтың нешінші жылы болды және бұл топты кім бастап барды?", answer: "Пайғамбарлықтың 5-жылы ражаб айында болды; топты Осман ибн Аффан бастап барды." },
      { question: "Эфиопия патшасы Нәжәшидің құзырында мұсылмандар атынан кім шешендікпен сөз сөйлеп, «Мәриям» сүресінің аяттарын оқып берді?", answer: "Жағфар ибн Әбу Талиб." },
      { question: "Һашим мен Мутталиб әулеттерін үш жыл бойы аш-жалаңаш блокадада ұстаған әділетсіз хаттаманы Қағба ішінен алып, бұзуға муһажирлерге жасырын азық тасып жүрген қай меккелік азамат бастамашы болды?", answer: "Һишам ибн Амр." }
    ]
  },
  {
    name: "Һижра, Мәдинадағы алғашқы реформалар және бауырластық",
    q: [
      { question: "Пайғамбарымыз (с.а.с.) Мәдинаға һижра жасау сапарында Әбу Бәкірмен (р.а.) бірге Меккеден шыққан соң қай үңгірде үш түн жасырынды?", answer: "Сәур үңгірінде." },
      { question: "Ислам тарихында тақуалыққа негізделіп тұрғызылған ең алғашқы мешіт қай жерде бой көтерді?", answer: "Құба мешіті." },
      { question: "Пайғамбарымыз (с.а.с.) Мәдинаға келген соң Меккеден көшкен муһажирлер мен жергілікті ансарларды бір-бірімен бауырластырған тарихи жиын қай сахабаның үйінде өтті?", answer: "Әнәс ибн Мәликтің үйінде." },
      { question: "Бірінші Ақаба антынан соң Мәдина тұрғындарына Ислам негіздерін, намаз бен Құранды үйрету үшін Пайғамбарымыз (с.а.с.) жіберген ең алғашқы елші кім?", answer: "Мусғаб ибн Ғұмайр." },
      { question: "Пайғамбарымыз (с.а.с.) Мәдинаға қоныс аударған кезде ол шаһарда қоныстанған яһудитердің негізгі үш тайпасын атаңыз.", answer: "Бәну Қайнуқағ, Бәну Надир және Бәну Құрайза." }
    ]
  },
  {
    name: "Ұлы шайқастар (Бәдір және Ухуд)",
    q: [
      { question: "Һижраның 2-жылы орын алған Ұлы Бәдір шайқасында мұсылмандар мен мүшріктер әскерінің саны қанша еді?", answer: "Мұсылмандар 313 (не 314/317) сарбаз, ал мүшріктер 1000-ға жуық (бастапқыда 1300) жауынгер болды." },
      { question: "Ухуд шайқасында Пайғамбарымыз (с.а.с.) әскердің арқа жағын қорғау үшін «Садақшылар тауына» Абдуллаһ ибн Жубәйрдің басшылығымен неше мергенді орналастырды?", answer: "50 садақшыны." },
      { question: "Бәдір шайқасында мүшріктердің басты қолбасшысы Әбу Жәһлді ауыр жаралап, жер жастандырған ансарлық екі жас батыр кімдер?", answer: "Афраның ұлдары — Муғаз ибн Амр және Муғаууиз ибн Афра." },
      { question: "Ухуд шайқасында мұсылман мергендері орындарын тастап кеткен сәтте, атты әскерімен тауды айналып өтіп, мұсылмандарға арқасынан соққы берген мүшрік қолбасшысы кім?", answer: "Халид ибн Уәлид." },
      { question: "Ухуд шайқасында Пайғамбарды (с.а.с.) өз денесімен қорғап, оннан астам қылыш-найза жарақатын алып, саусақтары сал болып қалған батыр сахаба кім?", answer: "Талха ибн Ғұбайдуллаһ." }
    ]
  },
  {
    name: "Хандақ, Худайбия және Мекке жеңісі",
    q: [
      { question: "Хандақ (Ахзаб) жорығында қалаға лап қойған одақтастар әскерінен қорғану үшін Мәдинаның айналасына ор қазу идеясын ұсынған сахаба кім?", answer: "Салман әл-Фариси." },
      { question: "Һижраның 6-жылы түзілген Худайбия келісімі бойынша мұсылмандар мен құрайыштар арасында соғыс неше жылға тоқтатылатын болып келісілді?", answer: "10 жылға соғыс тоқтатылды." },
      { question: "Худайбияда Осман ибн Аффанның (р.а.) Меккеде өлімі туралы жалған хабар тарағанда, Пайғамбарымыз (с.а.с.) сахабалардан ағаш түбінде алған серті тарихта қалай аталды?", answer: "«Ризашылық анты» (Бәйғат әр-ридуан)." },
      { question: "Һижраның 8-жылы Меккені бағындыру (Мекке жеңісі) жорығына мұсылмандар қанша әскермен аттанды?", answer: "10 000 (он мың) сахабамен аттанды." },
      { question: "Мекке жеңісі күні Пайғамбарымыз (с.а.с.) Қағбаның кілтін оның бұрынғы сақтаушысы болған қай сахабаға мәңгілікке қайтарып берді?", answer: "Осман ибн Талхаға." }
    ]
  }
];

const grid = document.getElementById('grid');

CATEGORIES.forEach((cat, catIdx) => {
  const label = document.createElement('div');
  label.className = 'cat-label';
  label.textContent = cat.name;
  grid.appendChild(label);

  POINTS.forEach((pt, colIdx) => {
    const cell = document.createElement('button');
    cell.className = `cell col-${colIdx}`;
    cell.setAttribute('data-cat', catIdx);
    cell.setAttribute('data-col', colIdx);
    cell.innerHTML = `<span class="points">${pt}</span><span class="checkmark">✓</span>`;
    cell.addEventListener('click', () => openCell(catIdx, colIdx, cell));
    grid.appendChild(cell);
  });
});

const overlay = document.getElementById('overlay');
const modalCat = document.getElementById('modalCat');
const modalPoints = document.getElementById('modalPoints');
const modalQuestion = document.getElementById('modalQuestion');
const modalAnswer = document.getElementById('modalAnswer');
const modalAnswerText = document.getElementById('modalAnswerText');
const revealBtn = document.getElementById('revealBtn');
const closeBtn = document.getElementById('closeBtn');

let activeCell = null;

function openCell(catIdx, colIdx, cellEl){
  if (cellEl.classList.contains('opened')) return;
  activeCell = cellEl;
  const cat = CATEGORIES[catIdx];
  const item = cat.q[colIdx];
  modalCat.textContent = cat.name;
  modalPoints.textContent = POINTS[colIdx] + ' ұпай';
  modalQuestion.textContent = item.question;
  modalAnswerText.textContent = item.answer;
  modalAnswer.classList.remove('show');
  revealBtn.style.display = 'inline-block';
  overlay.classList.add('show');
}

revealBtn.addEventListener('click', () => {
  modalAnswer.classList.add('show');
  revealBtn.style.display = 'none';
});

function closeModal(){
  overlay.classList.remove('show');
  if (activeCell){
    activeCell.classList.add('opened');
    activeCell = null;
  }
}

closeBtn.addEventListener('click', closeModal);
overlay.addEventListener('click', (e) => {
  if (e.target === overlay) closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && overlay.classList.contains('show')) closeModal();
});
</script>
</body>
</html>
